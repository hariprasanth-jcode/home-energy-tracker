spring.application.name=usage-service

server.port=8084

# kafka-consumer

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=usage-service-group-1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.leetjourney.EnergyUsageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

#kafka - producer

spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# influxdb
influx.url=http://localhost:8072
influx.token=my-token
influx.org=leetjourney
influx.bucket=usage-bucket

spring.autoconfigure.exclude=com.influxdb.spring.health.InfluxDB2HealthIndicatorAutoConfiguration

device.service.url=http://localhost:8082/api/v1/device
user.service.url=http://localhost:8081/api/v1/user 


